<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>F2F search results fragment (synthetic)</title>
  <!--
    Face to Face Games search results are JS-rendered (Alpine.js).
    Live product data is fetched from /apps/prod-indexer/search/... JSON API.
    This static fragment documents the per-variant card structure for reference.
    Parser implementation should use search_results_sample.json, not this HTML.
  -->
</head>
<body>
  <div class="section-template-main-padding" data-page-type="searchresults">
    <div id="product-grid" class="product-grid-container">
      <div class="bb-card-wrapper" data-product-handle="lightning-bolt-401-rulebook-showcase-commander-legends-battle-for-baldurs-gate-foil">
        <div class="bb-card-img">
          <a href="/products/lightning-bolt-401-rulebook-showcase-commander-legends-battle-for-baldurs-gate-foil">
            <img loading="lazy" alt="Lightning Bolt [401] [Rulebook Showcase] [Commander Legends: Battle for Baldur's Gate] [Foil]" src="https://cdn.shopify.com/s/files/1/0574/4692/4324/files/5c9c4c7975b10abdf44f6a88507c9788cad174f2_Asset_MTG_CLB_401_ENG_F_jpg.jpg?v=1737434772">
          </a>
        </div>
        <div class="bb-card-info">
          <div class="bb-card-title">Lightning Bolt [401] [Rulebook Showcase] [Commander Legends: Battle for Baldur's Gate] [Foil]</div>
          <div class="f2f-featured-variant">
            <div class="f2f-fv-title">
              <span class="f2f-fv-title-t">Lightning Bolt</span>
            </div>
            <div class="f2f-fv--price">
              <div class="price">
                <span class="price-item price-item--regular">$3.49</span>
              </div>
            </div>
            <div class="f2f-fv-buy" data-inventory="15">
              <span class="inventory-status">in stock</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
