<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wizard's Tower search results fragment (synthetic)</title>
  <!--
    Wizard's Tower search is JS-rendered via wt-filters Shopify app.
    Product data is fetched from app-filters.wizardtower.com/api/search (POST JSON).
    Parser implementation should use search_results_sample.json, not this HTML.
  -->
</head>
<body>
  <div class="wt-search-results" data-api-base="https://app-filters.wizardtower.com">
    <article class="wt-product-card" data-handle="lightning-bolt-042-sta-foil">
      <h3 class="wt-product-title">Lightning Bolt (042) (STA) - Foil</h3>
      <span class="wt-card-name">Lightning Bolt</span>
      <span class="wt-price">$10.00</span>
      <span class="wt-in-stock">in stock</span>
      <span class="wt-category">Strixhaven - Mystical Archive</span>
    </article>
  </div>
</body>
</html>
