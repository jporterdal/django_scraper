<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Remove Item Source</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center mb-4">Remove Item Source</h1>

    <div class="card mx-auto" style="max-width: 32rem;">
        <div class="card-body">
            <p>
                Remove the link between <strong>{{ item_source.item.text }}</strong>
                and source <strong>{{ item_source.source.name }}</strong>
                (<code>{{ item_source.source.key }}</code>)?
            </p>
            <p class="text-muted mb-0">The source itself and its stored results are not deleted; only this item's link and its patterns are removed.</p>
            <form method="post" class="mt-4 d-flex gap-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Remove</button>
                <a href="{% url 'item_sources' item_source.item_id %}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
