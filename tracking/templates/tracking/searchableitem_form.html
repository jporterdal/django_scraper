<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if object %}Edit Search Term{% else %}Add New Search Term{% endif %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center mb-4">
        {% if object %}Edit Search Term{% else %}Add New Search Term{% endif %}
    </h1>

    <p class="text-center">
        <a href="{% url 'view_terms' %}">View All Terms</a>
    </p>

    <div class="card mx-auto" style="max-width: 32rem;">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">
                    {% if object %}Save Changes{% else %}Add{% endif %}
                </button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
