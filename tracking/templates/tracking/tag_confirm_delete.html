<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Tag</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center mb-4">Delete Tag</h1>

    <div class="card mx-auto" style="max-width: 32rem;">
        <div class="card-body">
            <p>Are you sure you want to delete the tag <strong>{{ tag.name }}</strong>?</p>
            {% if item_count %}
                <p class="text-muted mb-0">{{ item_count }} item(s) currently use this tag. They will be untagged, not deleted.</p>
            {% endif %}
            <form method="post" class="mt-4 d-flex gap-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Delete</button>
                <a href="{% url 'view_tags' %}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
