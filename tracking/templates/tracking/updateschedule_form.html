<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scheduled Updates</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center mb-4">Scheduled Updates</h1>

    <div class="card">
        <div class="card-body text-center">
            <p class="text-muted mb-3">Scheduled updates are not yet available. Use manual updates for now.</p>
            <form method="post" action="{% url 'update' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" name="mode" value="all" class="btn btn-primary me-2">Run Update Now</button>
            </form>
            <a href="{% url 'view_updates' %}" class="btn btn-outline-secondary">View Scrape History</a>
        </div>
    </div>

    <p class="text-center mt-4">
        <a href="{% url 'view_terms' %}">Back to Terms</a>
    </p>
</div>

</body>
</html>
